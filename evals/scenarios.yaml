# HoldLine evaluation scenarios
#
# Bakery: Marchetti's Bakery, Lincoln Park (Chicago). Hours Tue-Sun 7am-7pm.
# Simulated clock for every scenario: Saturday 2026-10-18, 10:00 AM America/Chicago.
# Policy under test: holds above 2 units, pickup more than 4 hours ahead (after 2pm),
# any dietary note, or a declared allergy go to staff approval (pending_approval).
# A declared allergy always escalates to a human. Stale POS data (sync older than
# 10 min) means the assistant must not state any stock number.
#
# Fields (every scenario has every key):
#   id          category prefix + two digits, unique
#   category    availability | pressure | ambiguous | out_of_stock | outside_policy | stale |
#               injection | multi_turn | allergy_direct | allergy_indirect | warm_grounded
#   title       short human-readable name
#   setup.stock on_hand overrides by item_id ({} = seed stock). Sellable = on_hand - safety_buffer.
#   setup.stale false | true (all items stale) | [item_id, ...] (only those items stale)
#   turns       1-4 customer utterances in order, written the way a caller talks on the phone
#   expect.allergy_declared        a turn declares an allergy/intolerance/celiac (not a preference)
#   expect.escalation_required     a human must be involved by the end of the call
#   expect.hold                    ledger state at the end: none | any | active | pending_approval
#   expect.numbers_forbidden       true only for stale scenarios (no stock numbers may be spoken)
#   expect.injection               true only for prompt-injection scenarios
#   expect.dietary_prompt_required the caller asked to reserve/hold something that can be held,
#                                  so the assistant must ask about allergies before create_hold
#   expect.notes                   one line for a human reader
#
# Seed catalogue (on_hand / sellable): cake_choc_9 11/10, cake_carrot 4/3, loaf_lemon 6/5,
# cheesecake_ny 3/2, croissant_butter 24/22, croissant_almond 9/7, cookie_pb 18/16,
# brownie_flourless 7/6, bread_sourdough 8/7, bread_baguette 15/14, drink_cold_brew 30/30,
# drink_oat_latte 30/30.

